<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="500" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0d0b1e"/>
      <stop offset="100%" stop-color="#080614"/>
    </linearGradient>
    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7c6aff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7c6aff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="80" fill="url(#bg)"/>

  <!-- ── Constellation  center:(250,205)  pentRadius:140  ──
       A(250,65)   B(383,172)  C(336,325)  D(164,325)  E(117,172)  -->

  <!-- Perimeter lines -->
  <line x1="250" y1="65"  x2="383" y2="172" stroke="#7c6aff" stroke-width="1.8" stroke-opacity="0.6"/>
  <line x1="383" y1="172" x2="336" y2="325" stroke="#7c6aff" stroke-width="1.8" stroke-opacity="0.6"/>
  <line x1="336" y1="325" x2="164" y2="325" stroke="#7c6aff" stroke-width="1.8" stroke-opacity="0.6"/>
  <line x1="164" y1="325" x2="117" y2="172" stroke="#7c6aff" stroke-width="1.8" stroke-opacity="0.6"/>
  <line x1="117" y1="172" x2="250" y2="65"  stroke="#7c6aff" stroke-width="1.8" stroke-opacity="0.6"/>

  <!-- Spokes from center (dashed) -->
  <line x1="250" y1="205" x2="250" y2="65"  stroke="#7c6aff" stroke-width="1.1" stroke-opacity="0.3" stroke-dasharray="9 7"/>
  <line x1="250" y1="205" x2="383" y2="172" stroke="#7c6aff" stroke-width="1.1" stroke-opacity="0.3" stroke-dasharray="9 7"/>
  <line x1="250" y1="205" x2="336" y2="325" stroke="#7c6aff" stroke-width="1.1" stroke-opacity="0.3" stroke-dasharray="9 7"/>
  <line x1="250" y1="205" x2="164" y2="325" stroke="#7c6aff" stroke-width="1.1" stroke-opacity="0.3" stroke-dasharray="9 7"/>
  <line x1="250" y1="205" x2="117" y2="172" stroke="#7c6aff" stroke-width="1.1" stroke-opacity="0.3" stroke-dasharray="9 7"/>

  <!-- Vertex dots -->
  <circle cx="250" cy="65"  r="8"   fill="#7c6aff"/>
  <circle cx="383" cy="172" r="6"   fill="#a594ff"/>
  <circle cx="336" cy="325" r="8"   fill="#7c6aff"/>
  <circle cx="164" cy="325" r="6"   fill="#a594ff"/>
  <circle cx="117" cy="172" r="8"   fill="#7c6aff"/>

  <!-- Center hub -->
  <circle cx="250" cy="205" r="55" fill="url(#bloom)"/>
  <circle cx="250" cy="205" r="17" fill="#130e3a" stroke="#9888ff" stroke-width="6"/>
  <circle cx="250" cy="205" r="6"  fill="white" fill-opacity="0.92"/>

  <!-- ── Text ── -->
  <text x="250" y="390"
        text-anchor="middle"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="52" font-weight="700" letter-spacing="6" fill="#eeeef8">DOTSTELL</text>

  <text x="250" y="438"
        text-anchor="middle"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="26" font-weight="700" letter-spacing="16" fill="rgba(180,165,255,0.88)">LABS</text>
</svg>
